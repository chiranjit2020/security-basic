site_name: Web Security
site_description: A backend developer's mental model for web application security.
site_author: Chiranjit
site_url: https://www.chiranjitkarmakar.com/security-basic/
copyright: >
  &copy; 2026 &middot; Developed with &#10084;&#65039; by
  <a href="https://chiranjitkarmakar.com" rel="author">Chiranjit Karmakar</a>
repo_url: https://github.com/chiranjit2020/security-basic
repo_name: chiranjit2020/security-basic
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/icons/logo.svg
  favicon: assets/icons/icon.svg
  font:
    text: Ubuntu
    code: Ubuntu Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
    status:
      coming-soon: material/clock-outline

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # Pre-reads every page's front matter so `status:` markers resolve in the
  # nav (nav_item.meta) regardless of page build order.
  - meta

extra:
  generator: false
  status:
    coming-soon: Coming soon
  seo:
    # Paste the token from Google Search Console → Settings → Ownership
    # verification → HTML tag (just the content="..." value).
    google_site_verification: "8G7FLNWz8MH7hql0uVNdkX72ZHnBD8cvdN92zXzIdlg"

not_in_nav: |
  offline.md
  design-system.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Foundations:
      - foundations/index.md
      - The Three States of Data: foundations/states-of-data.md
      - Backup Data: foundations/backup-data.md
  - Chapters:
      - chapters/index.md
      - Chapter 1 — CIA Triad: chapters/01-cia-triad.md
      - Chapter 2 — Authentication vs Authorization: chapters/02-authentication-vs-authorization.md
      - Chapter 3 — Encryption vs Hashing vs Encoding: chapters/03-encryption-hashing-encoding.md
      - Chapter 4 — Symmetric vs Asymmetric Cryptography: chapters/04-symmetric-vs-asymmetric.md
      - Chapter 5 — TLS, HTTPS & Digital Certificates: chapters/05-tls-https-certificates.md
      - Chapter 6 — Password Security: chapters/06-password-security.md
      - Chapter 7 — Secrets & Key Management: chapters/07-secrets-key-management.md
      - Chapter 8 — Data Integrity: chapters/08-data-integrity.md
      - Chapter 9 — Access Control Models: chapters/09-access-control-models.md
      - Chapter 10 — Backup Security: chapters/10-backup-security.md
